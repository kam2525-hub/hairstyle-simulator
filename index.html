<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI HairStudio - トレンド髪型シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .checkerboard {
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%),
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #1e293b 75%),
                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #0b0f19;
    }
    input[type=range] {
      accent-color: #6366f1;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- ヘッダー -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50 px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-scissors text-white text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-black bg-gradient-to-r from-white via-indigo-100 to-indigo-300 bg-clip-text text-transparent">
              AI HairStudio
            </h1>
            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
              顔固定・実写合成
            </span>
          </div>
          <p class="text-xs text-slate-400">センターパート / ウルフ / コンマバングなど人気トレンドを完全再現</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          AIエンジン稼働中
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左側: キャンバスプレビュー (7カラム) -->
    <div class="lg:col-span-7 flex flex-col gap-4">
      <div class="relative bg-slate-900/90 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl flex flex-col items-center justify-center min-h-[500px] p-4">
        
        <!-- キャンバス表示エリア -->
        <div id="canvas-wrapper" class="relative max-w-full max-h-[520px] rounded-xl overflow-hidden shadow-2xl checkerboard flex items-center justify-center">
          
          <!-- メインキャンバス -->
          <canvas id="mainCanvas" class="block max-w-full h-auto cursor-grab active:cursor-grabbing"></canvas>

          <!-- ローディングオーバーレイ -->
          <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center hidden z-30">
            <div class="relative w-16 h-16 mb-4">
              <div class="absolute inset-0 rounded-full border-4 border-indigo-500/20 border-t-indigo-500 animate-spin"></div>
              <div class="absolute inset-0 flex items-center justify-center">
                <i class="fa-solid fa-wand-magic-sparkles text-lg text-indigo-400 animate-pulse"></i>
              </div>
            </div>
            <h3 class="text-sm font-bold text-white mb-1">髪型をシームレス合成中...</h3>
            <p class="text-xs text-slate-400">目・鼻・肌色はそのまま保ち、生え際を馴染ませています</p>
          </div>

          <!-- 未アップロード時案内 -->
          <div id="emptyGuide" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-900/95 backdrop-blur-sm z-20">
            <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 text-3xl mb-4 shadow-lg shadow-indigo-500/10">
              <i class="fa-solid fa-user"></i>
            </div>
            <h3 class="font-bold text-lg text-white mb-2">自分の顔写真をセット</h3>
            <p class="text-xs text-slate-400 max-w-md mb-6 leading-relaxed">
              正面から撮った顔写真を選ぶか、サンプルモデルですぐに試せます。
            </p>
            <div class="flex flex-wrap items-center justify-center gap-3">
              <label class="cursor-pointer px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm flex items-center gap-2 shadow-lg shadow-indigo-600/30 transition transform hover:-translate-y-0.5">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                自分の写真をアップロード
                <input type="file" id="imageInput" accept="image/*" class="hidden">
              </label>
              <button id="btnSampleMale" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition">
                👨 男性モデルで試す
              </button>
              <button id="btnSampleFemale" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition">
                👩 女性モデルで試す
              </button>
            </div>
          </div>
        </div>

        <!-- ツールバー -->
        <div class="w-full mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-slate-800/80 pt-3">
          <div class="flex items-center gap-2">
            <button id="btnToggleCompare" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 flex items-center gap-1.5 transition">
              <i class="fa-solid fa-eye"></i> Before確認 (長押し)
            </button>
            <button id="btnResetAdjust" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-400 hover:text-slate-200 transition">
              <i class="fa-solid fa-rotate-left"></i> 位置リセット
            </button>
          </div>
          <div class="flex items-center gap-2">
            <label class="cursor-pointer px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 flex items-center gap-1.5 transition">
              <i class="fa-solid fa-camera"></i> 写真変更
              <input type="file" id="imageInputAlt" accept="image/*" class="hidden">
            </label>
            <button id="btnDownload" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white flex items-center gap-1.5 shadow-lg shadow-emerald-600/30 transition">
              <i class="fa-solid fa-download"></i> 高画質保存
            </button>
          </div>
        </div>
      </div>

      <!-- 位置・フィット微調整 -->
      <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 flex flex-col gap-2">
        <div class="flex items-center justify-between text-xs font-bold text-slate-300">
          <span class="flex items-center gap-1.5">
            <i class="fa-solid fa-sliders text-indigo-400"></i>
            髪型の位置・大きさ微調整
          </span>
          <span class="text-[11px] text-slate-400 font-normal">※キャンバス直接ドラッグでも移動可能</span>
        </div>
        <div class="grid grid-cols-3 gap-3 text-xs pt-1">
          <div>
            <div class="flex justify-between text-slate-400 text-[11px] mb-1">
              <span>大きさ</span>
              <span id="valScale">100%</span>
            </div>
            <input type="range" id="rangeScale" min="80" max="130" value="100" class="w-full">
          </div>
          <div>
            <div class="flex justify-between text-slate-400 text-[11px] mb-1">
              <span>生え際 (上下)</span>
              <span id="valOffsetY">0px</span>
            </div>
            <input type="range" id="rangeOffsetY" min="-80" max="80" value="0" class="w-full">
          </div>
          <div>
            <div class="flex justify-between text-slate-400 text-[11px] mb-1">
              <span>左右位置</span>
              <span id="valOffsetX">0px</span>
            </div>
            <input type="range" id="rangeOffsetX" min="-60" max="60" value="0" class="w-full">
          </div>
        </div>
      </div>
    </div>

    <!-- 右側: 人気ヘアスタイル & カラー選択 (5カラム) -->
    <div class="lg:col-span-5 flex flex-col gap-4">

      <!-- 性別タブ -->
      <div class="bg-slate-900 p-1.5 rounded-2xl border border-slate-800 flex">
        <button id="tabMen" class="flex-1 py-2.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition bg-indigo-600 text-white shadow-lg shadow-indigo-600/20">
          <i class="fa-solid fa-mars"></i> Men's (メンズ人気)
        </button>
        <button id="tabWomen" class="flex-1 py-2.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition text-slate-400 hover:text-white">
          <i class="fa-solid fa-venus"></i> Women's (レディース人気)
        </button>
      </div>

      <!-- トレンドヘアカタログ -->
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold flex items-center gap-2 text-slate-200">
            <i class="fa-solid fa-fire text-amber-400"></i>
            トレンド髪型カタログ
          </h2>
          <span id="currentStyleLabel" class="text-xs text-indigo-400 font-bold bg-indigo-500/10 px-2.5 py-1 rounded-lg border border-indigo-500/20">
            センターパート
          </span>
        </div>
        
        <!-- スタイルカード一覧 -->
        <div id="hairStyleGrid" class="grid grid-cols-2 gap-2.5 max-h-[290px] overflow-y-auto pr-1">
          <!-- JSで動的生成 -->
        </div>
      </div>

      <!-- ヘアカラー -->
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold flex items-center gap-2 text-slate-200">
            <i class="fa-solid fa-palette text-pink-400"></i>
            髪色 (ヘアカラー)
          </h2>
          <span id="currentColorLabel" class="text-xs text-pink-400 font-medium bg-pink-500/10 px-2 py-0.5 rounded">
            ナチュラルブラック
          </span>
        </div>
        
        <div id="hairColorGrid" class="grid grid-cols-4 gap-2">
          <!-- JSで動的生成 -->
        </div>
      </div>

      <!-- 合成ボタン -->
      <button id="btnGenerateAI" class="w-full py-4 rounded-xl bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:via-purple-500 hover:to-pink-500 text-white font-black text-base flex items-center justify-center gap-2.5 shadow-xl shadow-indigo-600/30 transition transform hover:scale-[1.02] active:scale-[0.98]">
        <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
        ✨ 選択した髪型にチェンジする
      </button>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
