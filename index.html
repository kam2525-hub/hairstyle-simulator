<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI HairStudio - 同じ顔のまま試せるバーチャルヘアサロン</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .checkerboard {
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%),
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #1e293b 75%),
                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #0b0f19;
    }
    input[type=range] {
      accent-color: #6366f1;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- ヘッダー -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50 px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-scissors text-white text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-black bg-gradient-to-r from-white via-indigo-100 to-indigo-300 bg-clip-text text-transparent">
              AI HairStudio
            </h1>
            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
              同一正面モデル対応
            </span>
          </div>
          <p class="text-xs text-slate-400">全く同じ正面の顔のまま、センターパート・コンマバング・ウルフを試せます</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          リアルタイム切替
        </span>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左側: メインキャンバスプレビュー (7カラム) -->
    <div class="lg:col-span-7 flex flex-col gap-4">
      <div class="relative bg-slate-900/90 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl flex flex-col items-center justify-center min-h-[500px] p-4">
        
        <!-- キャンバスエリア -->
        <div id="canvas-wrapper" class="relative max-w-full max-h-[520px] rounded-xl overflow-hidden shadow-2xl checkerboard flex items-center justify-center">
          <canvas id="mainCanvas" class="block max-w-full h-auto cursor-grab active:cursor-grabbing"></canvas>
        </div>

        <!-- ツールバー -->
        <div class="w-full mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-slate-800/80 pt-3">
          <div class="flex items-center gap-2">
            <button id="btnToggleCompare" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 flex items-center gap-1.5 transition">
              <i class="fa-solid fa-eye"></i> Before確認 (長押し)
            </button>
            <button id="btnResetAdjust" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-400 hover:text-slate-200 transition">
              <i class="fa-solid fa-rotate-left"></i> 位置リセット
            </button>
          </div>
          <div class="flex items-center gap-2">
            <label class="cursor-pointer px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 flex items-center gap-1.5 transition">
              <i class="fa-solid fa-camera"></i> 写真変更
              <input type="file" id="imageInput" accept="image/*" class="hidden">
            </label>
            <button id="btnDownload" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white flex items-center gap-1.5 shadow-lg shadow-emerald-600/30 transition">
              <i class="fa-solid fa-download"></i> 写真を保存
            </button>
          </div>
        </div>
      </div>

      <!-- 位置・大きさ微調整コントロール -->
      <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 flex flex-col gap-2">
        <div class="flex items-center justify-between text-xs font-bold text-slate-300">
          <span class="flex items-center gap-1.5">
            <i class="fa-solid fa-sliders text-indigo-400"></i>
            髪型の位置・生え際フィット調整
          </span>
          <span class="text-[11px] text-slate-400 font-normal">※キャンバス上のドラッグでも移動できます</span>
        </div>
        <div class="grid grid-cols-3 gap-3 text-xs pt-1">
          <div>
            <div class="flex justify-between text-slate-400 text-[11px] mb-1">
              <span>大きさ</span>
              <span id="valScale">100%</span>
            </div>
            <input type="range" id="rangeScale" min="80" max="130" value="100" class="w-full">
          </div>
          <div>
            <div class="flex justify-between text-slate-400 text-[11px] mb-1">
              <span>生え際 (上下)</span>
              <span id="valOffsetY">0px</span>
            </div>
            <input type="range" id="rangeOffsetY" min="-80" max="80" value="0" class="w-full">
          </div>
          <div>
            <div class="flex justify-between text-slate-400 text-[11px] mb-1">
              <span>左右位置</span>
              <span id="valOffsetX">0px</span>
            </div>
            <input type="range" id="rangeOffsetX" min="-60" max="60" value="0" class="w-full">
          </div>
        </div>
      </div>
    </div>

    <!-- 右側: チャット & カタログ選択 (5カラム) -->
    <div class="lg:col-span-5 flex flex-col gap-4">

      <!-- 💬 チャットでオーダーBOX -->
      <div class="bg-gradient-to-b from-indigo-950/50 to-slate-900 p-4 rounded-2xl border border-indigo-500/40 shadow-xl flex flex-col gap-2.5">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-black text-white flex items-center gap-1.5">
            <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>
            チャットでオーダー
          </h2>
          <span id="currentStyleLabel" class="text-[11px] text-indigo-400 font-bold bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">
            センターパート
          </span>
        </div>

        <div class="relative">
          <input type="text" id="chatPromptInput" placeholder="例: センターパート、コンマバング、ウルフカット..." class="w-full px-3 py-2 pr-16 rounded-xl bg-slate-950 border border-indigo-500/40 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-400">
          <button id="btnSubmitChat" class="absolute top-1 right-1 px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs transition">
            送信
          </button>
        </div>

        <!-- ワンタップ入力 -->
        <div class="flex flex-wrap gap-1.5 pt-1">
          <button class="quick-btn text-[11px] px-2.5 py-1 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 text-indigo-300 border border-indigo-800/60 font-semibold transition" data-id="m_center" data-name="センターパート">
            センターパート
          </button>
          <button class="quick-btn text-[11px] px-2.5 py-1 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 text-indigo-300 border border-indigo-800/60 font-semibold transition" data-id="m_comma" data-name="コンマバング">
            コンマバング
          </button>
          <button class="quick-btn text-[11px] px-2.5 py-1 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 text-indigo-300 border border-indigo-800/60 font-semibold transition" data-id="m_wolf" data-name="ウルフカット">
            ウルフカット
          </button>
          <button class="quick-btn text-[11px] px-2.5 py-1 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 text-indigo-300 border border-indigo-800/60 font-semibold transition" data-id="m_mash" data-name="ナチュラルマッシュ">
            マッシュ
          </button>
          <button class="quick-btn text-[11px] px-2.5 py-1 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 text-indigo-300 border border-indigo-800/60 font-semibold transition" data-id="m_spiral" data-name="スパイラルパーマ">
            パーマ
          </button>
        </div>
      </div>

      <!-- 性別タブ -->
      <div class="bg-slate-900 p-1.5 rounded-2xl border border-slate-800 flex">
        <button id="tabMen" class="flex-1 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition bg-indigo-600 text-white shadow">
          <i class="fa-solid fa-mars"></i> メンズ (Men's)
        </button>
        <button id="tabWomen" class="flex-1 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition text-slate-400 hover:text-white">
          <i class="fa-solid fa-venus"></i> レディース (Women's)
        </button>
      </div>

      <!-- カタログ選択 -->
      <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 flex flex-col gap-2">
        <div id="hairStyleGrid" class="grid grid-cols-2 gap-2 max-h-[260px] overflow-y-auto pr-1">
          <!-- JSで動的生成 -->
        </div>
      </div>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
