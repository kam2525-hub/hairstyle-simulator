<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI HairStudio - チャット指示で髪型を変えるバーチャルサロン</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- ヘッダー -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50 px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-scissors text-white text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-black bg-gradient-to-r from-white via-indigo-100 to-indigo-300 bg-clip-text text-transparent">
              AI HairStudio
            </h1>
            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
              チャットAIサロン
            </span>
          </div>
          <p class="text-xs text-slate-400">チャットで「センターパートにして」と頼むだけで髪型を生成</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnOpenApiKeyModal" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-key text-amber-400"></i> Google AI設定 (無料)
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左側: メインプレビュー (7カラム) -->
    <div class="lg:col-span-7 flex flex-col gap-4">
      <div class="relative bg-slate-900/90 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl flex flex-col items-center justify-center min-h-[500px] p-4">
        
        <!-- 画像表示エリア -->
        <div class="relative w-full max-w-[500px] rounded-xl overflow-hidden shadow-2xl bg-slate-950 flex flex-col items-center justify-center aspect-[3/4]">
          <img id="mainResultImg" src="assets/catalog/m_center.jpg" alt="Hair Preview" class="w-full h-full object-cover">

          <!-- ローディング -->
          <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center hidden z-30">
            <div class="relative w-16 h-16 mb-4">
              <div class="absolute inset-0 rounded-full border-4 border-indigo-500/20 border-t-indigo-500 animate-spin"></div>
              <div class="absolute inset-0 flex items-center justify-center">
                <i class="fa-solid fa-wand-magic-sparkles text-lg text-indigo-400 animate-pulse"></i>
              </div>
            </div>
            <h3 class="text-sm font-bold text-white mb-1" id="loadingTitle">AIが髪型を生成中...</h3>
            <p class="text-xs text-slate-400">オーダー通りのヘアスタイルを描き出しています</p>
          </div>
        </div>

        <!-- ツールバー -->
        <div class="w-full max-w-[500px] mt-4 flex items-center justify-between gap-3 border-t border-slate-800/80 pt-3">
          <div class="flex items-center gap-2">
            <span id="currentStatusBadge" class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-lg border border-indigo-500/20">
              スタイル: センターパート
            </span>
          </div>
          <div class="flex items-center gap-2">
            <button id="btnDownload" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white flex items-center gap-1.5 shadow-lg shadow-emerald-600/30 transition">
              <i class="fa-solid fa-download"></i> 写真を保存
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右側: チャットで髪型オーダー & プリセット (5カラム) -->
    <div class="lg:col-span-5 flex flex-col gap-4">

      <!-- 💬 チャットで髪型オーダーBOX -->
      <div class="bg-gradient-to-b from-indigo-950/50 to-slate-900 p-5 rounded-2xl border border-indigo-500/40 shadow-xl flex flex-col gap-3">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>
          <h2 class="text-sm font-black text-white">チャットでAIにオーダーする</h2>
        </div>
        <p class="text-xs text-slate-300 leading-relaxed">
          美容室で頼むように、希望の髪型やカラーを入力して送信してください：
        </p>

        <!-- 入力フォーム -->
        <div class="relative">
          <textarea id="chatPromptInput" rows="3" placeholder="例: 襟足レイヤーの立体的なウルフカットにして" class="w-full p-3 pr-12 rounded-xl bg-slate-950 border border-indigo-500/40 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 resize-none"></textarea>
          <button id="btnSubmitChat" class="absolute bottom-2.5 right-2.5 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center gap-1.5 shadow-md shadow-indigo-600/30 transition">
            <span>オーダー</span>
            <i class="fa-solid fa-paper-plane text-[10px]"></i>
          </button>
        </div>

        <!-- よく使われるオーダー例（ワンタップ入力） -->
        <div class="flex flex-wrap gap-1.5 pt-2">
          <span class="text-[10px] text-slate-400 self-center mr-1">ワンタップ:</span>
          <button class="quick-prompt text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-900/50 font-medium transition" data-text="前髪をセンター分けにした大人っぽいセンターパート">
            センターパート
          </button>
          <button class="quick-prompt text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-900/50 font-medium transition" data-text="韓国アイドル風の内巻きコンマバング">
            コンマバング
          </button>
          <button class="quick-prompt text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-900/50 font-medium transition" data-text="襟足レイヤーの立体的なウルフカット">
            ウルフカット
          </button>
          <button class="quick-prompt text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-900/50 font-medium transition" data-text="波打ちウェーブのスパイラルパーマ">
            スパイラルパーマ
          </button>
          <button class="quick-prompt text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-pink-300 border border-pink-900/50 font-medium transition" data-text="韓国風くびれレイヤーカット">
            くびれレイヤー
          </button>
          <button class="quick-prompt text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-pink-300 border border-pink-900/50 font-medium transition" data-text="顎ラインの綺麗な切りっぱなしボブ">
            切りっぱなしボブ
          </button>
        </div>
      </div>

      <!-- 性別タブ -->
      <div class="bg-slate-900 p-1.5 rounded-2xl border border-slate-800 flex">
        <button id="tabMen" class="flex-1 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition bg-indigo-600 text-white shadow">
          <i class="fa-solid fa-mars"></i> メンズ人気カタログ
        </button>
        <button id="tabWomen" class="flex-1 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition text-slate-400 hover:text-white">
          <i class="fa-solid fa-venus"></i> レディース人気カタログ
        </button>
      </div>

      <!-- カタロググリッド -->
      <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 flex flex-col gap-2">
        <div id="hairStyleGrid" class="grid grid-cols-3 gap-2 max-h-[220px] overflow-y-auto pr-1">
          <!-- JSで動的生成 -->
        </div>
      </div>

    </div>

  </main>

  <!-- Google AI Studio 設定モーダル -->
  <div id="apiKeyModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button id="btnCloseModal" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-lg">
          <i class="fa-solid fa-key"></i>
        </div>
        <div>
          <h3 class="font-bold text-base text-white">Google AI Studio 設定 (完全無料)</h3>
          <p class="text-xs text-slate-400">Googleの最先端AIで超高画質生成</p>
        </div>
      </div>

      <p class="text-xs text-slate-300 mb-4 leading-relaxed">
        <a href="https://aistudio.google.com/apikey" target="_blank" class="text-indigo-400 underline font-semibold">Google AI Studio</a> で無料のAPIキーを1分で発行できます（クレジットカード不要）。
      </p>

      <div class="space-y-3 mb-5">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">API Key</label>
          <input type="password" id="inputApiKey" placeholder="AIzaSy..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white text-xs focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div class="flex items-center justify-end gap-2">
        <button id="btnClearApiKey" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-300">
          クリア
        </button>
        <button id="btnSaveApiKey" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white shadow-lg shadow-indigo-600/30">
          保存して適用
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
